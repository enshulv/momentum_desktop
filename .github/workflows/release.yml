name: 🚀 Auto Release

on:
  push:
    branches:
      - main
      - new-feature-branch
jobs:
  # 第一步：检查是否需要发布
  check-release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      next-version: ${{ steps.check.outputs.next-version }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check if release is needed
        id: check
        run: |
          echo "🔍 检查是否需要发布新版本..."
          
          # 使用semantic-release的dry-run模式检查是否需要发布
          npx semantic-release --dry-run > release-check.log 2>&1 || true
          
          # 检查输出中是否包含新版本信息
          if grep -q "The next release version is" release-check.log; then
            NEXT_VERSION=$(grep "The next release version is" release-check.log | sed 's/.*The next release version is \([0-9.]*\).*/\1/')
            echo "✅ 检测到需要发布新版本: $NEXT_VERSION"
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "next-version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ 当前提交不需要发布新版本（可能是docs、style、chore等类型的提交）"
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "next-version=" >> $GITHUB_OUTPUT
          fi
          
          echo "=== Release Check Log ==="
          cat release-check.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 第二步：只有在需要发布时才进行构建和发布
  build-and-release:
    needs: check-release
    runs-on: windows-latest
    if: needs.check-release.outputs.should-release == 'true'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 缓存Electron二进制文件
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint code
        run: npm run lint

      - name: 📢 Release notification start
        run: |
          echo "🚀 开始构建和发布版本: ${{ needs.check-release.outputs.next-version }}"
          echo "📝 本次发布将包含以下更改类型的提交"
      
      - name: 🚀 Semantic Release (更新版本号并构建发布)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      - name: 📢 Success notification
        run: |
          echo "✅ 版本 ${{ needs.check-release.outputs.next-version }} 构建和发布完成！"
          echo "📦 下载地址: https://github.com/${{ github.repository }}/releases/latest"

  # 第三步：当不需要发布时的通知
  skip-notification:
    needs: check-release
    runs-on: ubuntu-latest
    if: needs.check-release.outputs.should-release == 'false'
    
    steps:
      - name: 📢 Skip notification
        run: |
          echo "ℹ️ 跳过构建和发布流程"
          echo "📝 当前提交不包含需要发布的更改（如：docs、style、chore等）"
          echo "💡 如需强制发布，请使用 feat: 或 fix: 类型的提交信息"
